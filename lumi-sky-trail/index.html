<main><header><a class="brand" href="#" id="home"><span class="brand-icon">✦</span> LUMI <small>SKY TRAIL</small></a><div class="header-right"><span class="tag">20개의 작은 모험</span><button id="sound" aria-label="소리 켜기">소리 OFF</button><button id="pause">일시정지 <kbd>P</kbd></button></div></header>
<section class="game-shell"><div class="hud"><div><span class="eyebrow" id="world">WORLD 01 · 초록빛 들판</span><strong id="stageLabel">01 <span>/ 20</span></strong></div><div class="stats"><div><small>별 조각</small><b id="coins">✦ 0</b></div><div><small>생명력</small><b id="health">♥ ♥ ♥</b></div><div><small>시간</small><b id="timer">00:00</b></div></div></div>
<div class="canvas-wrap"><canvas id="game" width="1200" height="600" aria-label="루미의 하늘길 게임 화면"></canvas><div id="overlay" class="overlay"><div id="panel" class="panel"></div></div><div id="toast" role="status"></div><div class="touch"><div><button data-key="ArrowLeft" aria-label="왼쪽">◀</button><button data-key="ArrowRight" aria-label="오른쪽">▶</button></div><div><button data-key="Shift" class="dash">달리기</button><button data-key="Space" class="jump">점프</button></div></div></div>

<footer><div><span class="footer-title">작은 발걸음, 커다란 모험.</span><p>다섯 개의 세계를 건너 흩어진 별빛을 되찾아 주세요.</p></div><div class="controls"><span><kbd>←</kbd><kbd>→</kbd> 이동</span><span><kbd>SPACE</kbd> 점프</span><span><kbd>SHIFT</kbd> 달리기</span><span><kbd>R</kbd> 다시 시작</span></div></footer></main><script>'use strict';
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s),W=1200,H=600;
const themes=[
 {name:'초록빛 들판',sky:['#a8d7c5','#e4efd0'],mount:'#71ad91',far:'#8fc3a5',ground:'#596c48',top:'#acd581',accent:'#f6d27a'},
 {name:'바람의 사막',sky:['#eac499','#fae5bd'],mount:'#c59879',far:'#dbb48c',ground:'#a77959',top:'#edc88b',accent:'#fbebae'},
 {name:'유리눈 설원',sky:['#9dbfcf','#e1e9e8'],mount:'#80a6b8',far:'#b6cfda',ground:'#638b9e',top:'#f2f5e8',accent:'#9df2ef'},
 {name:'달무리 하늘',sky:['#303b63','#8c81a8'],mount:'#4e537a',far:'#626487',ground:'#57516c',top:'#b4a6ce',accent:'#ebc5ff'},
 {name:'별빛 성채',sky:['#302d49','#a4727c'],mount:'#4c3d56',far:'#695169',ground:'#544359',top:'#c18b93',accent:'#ffe39a'}];
const titles=['첫 번째 발걸음','잎새 징검다리','숲의 높은 길','이끼 수호자','모래바람 산책','오래된 수로','사막의 공중정원','호박빛 수호자','눈꽃 언덕','얼음 사이로','흔들리는 빙하','서리 수호자','달빛 정거장','별 사이를 건너','구름 위의 질주','황혼 수호자','잊힌 성문','붉은 톱니길','마지막 하늘다리','별빛의 심장'];
let saved={done:[],best:{},last:1};try{Object.assign(saved,JSON.parse(localStorage.getItem('lumi-sky-v1')||'{}'))}catch{};
let state='menu',level=1,world,player,camera=0,tick=0,elapsed=0,coins=0,checkpoint=80,checkpointActive=false,particles=[],shake=0,toastTime=0,jumpBuffer=0,coyote=0,keys={},audio=null,muted=true,lastTime=0,acc=0,deathCount=0;

function persist(){try{localStorage.setItem('lumi-sky-v1',JSON.stringify(saved))}catch{}}
function tone(f=500,d=.1,type='sine',v=.05){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.65,audio.currentTime+d);g.gain.setValueAtTime(v,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function toast(t){$('#toast').textContent=t;$('#toast').style.opacity=1;toastTime=180}
function burst(x,y,color,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*6-1,life:35+Math.random()*20,color})}
function makeLevel(n){
 const biome=Math.floor((n-1)/4),difficulty=(n-1)%4,platforms=[],gems=[],enemies=[],hazards=[],blocks=[],powers=[];
 const ground=(x,w,y=490)=>platforms.push({x,y,w,h:140,ground:true});
 const ledge=(x,y,w,moving=false)=>platforms.push({x,y,w,h:22,moving,base:x,phase:x*.01,dx:0});
 let x=0;const count=5+difficulty;
 for(let s=0;s<count;s++){
  const width=440+((s+n)%3)*40;ground(x,width);
  if(s>0){enemies.push({x:x+170,y:460,w:34,h:30,vx:(1+biome*.17)*(s%2?-1:1),min:x+35,max:x+width-35,dead:false});if(difficulty>1&&s%2===0)enemies.push({x:x+width-120,y:460,w:34,h:30,vx:-1.3,min:x+40,max:x+width-40,dead:false});}
  if(s%2===0){ledge(x+180,390,115);ledge(x+320,310,100);blocks.push({x:x+75,y:373,w:40,h:36,used:false,power:s===0||s===4});for(let j=0;j<3;j++)gems.push({x:x+200+j*33,y:350,w:18,h:22,taken:false});gems.push({x:x+357,y:270,w:18,h:22,taken:false});}
  else{ledge(x+140,385,145,biome>=2);for(let j=0;j<4;j++)gems.push({x:x+130+j*36,y:330,w:18,h:22,taken:false});}
  if(biome>0&&s>0&&s%2===1)hazards.push({x:x+width-105,y:470,w:46,h:20,type:'spikes'});

  for(let j=0;j<3;j++)gems.push({x:x+width+gap*(j+1)/4,y:375-Math.sin((j+1)*Math.PI/4)*35,w:18,h:22,taken:false});
  if(s===Math.floor(count/2))var cp=x+30;
  x+=width+gap;
 }
 ground(x,760);const boss=difficulty===3?{x:x+380,y:426,w:66,h:64,hp:3+Math.floor(biome/2),maxHp:3+Math.floor(biome/2),vx:1.7+biome*.2,min:x+200,max:x+570,inv:0,baseY:426}:null;
 return {n,biome,platforms,gems,enemies,hazards,blocks,powers,boss,width:x+760,goal:x+650,checkpoint:cp,title:titles[n-1]};
}
function load(n){level=n;world=makeLevel(n);player={x:80,y:400,w:29,h:42,vx:0,vy:0,hp:3,inv:0,shield:0,face:1,onGround:false};camera=0;elapsed=0;coins=0;checkpoint=80;checkpointActive=false;particles=[];tick=0;deathCount=0;keys={};jumpBuffer=0;coyote=0;saved.last=n;persist();updateHUD();$('#hint').textContent=n===1?'빛나는 상자를 아래에서 두드려 보세요.':'중간의 별 등불을 켜면 그곳에서 다시 시작합니다.';}
function updateHUD(){$('#world').textContent=`WORLD ${String(world.biome+1).padStart(2,'0')} · ${themes[world.biome].name}`;$('#stageLabel').innerHTML=String(level).padStart(2,'0')+' <span>/ 20</span>';$('#coins').textContent='✦ '+coins;$('#health').textContent='♥ '.repeat(player.hp)+'♡ '.repeat(3-player.hp);$('#timer').textContent=String(Math.floor(elapsed/60)).padStart(2,'0')+':'+String(Math.floor(elapsed%60)).padStart(2,'0');}
function modal(html){$('#panel').innerHTML=html;$('#overlay').classList.remove('hidden');}
function play(n){load(n);state='playing';$('#overlay').classList.add('hidden');tone(660);toast(`${String(n).padStart(2,'0')} · ${world.title}`);}
function menu(){state='menu';modal(`<div class="overline">A LITTLE LIGHT. A BIG ADVENTURE.</div><h1>루미의<br>하늘길<span style="color:#d9f99b">.</span></h1><p>사라진 별빛을 찾아 떠나는 작은 여행자.<br>뛰어오르고, 별을 모으고, 20개의 길을 완성하세요.</p><button class="primary" data-action="start">${saved.last>1?'모험 이어하기':'모험 시작하기'} <span style="margin-left:20px">→</span></button><button class="secondary" data-action="levels">스테이지</button><p class="tiny">방향키로 이동 · SPACE로 점프 · SHIFT로 달리기</p>`);}
function levelMenu(){state='select';modal(`<div class="overline">CHOOSE YOUR TRAIL</div><h2>어디로 떠나볼까요?</h2><p style="margin-bottom:5px">모든 스테이지를 자유롭게 즐길 수 있어요. ${saved.done.length}/20 완료</p><div class="levels-grid">${titles.map((t,i)=>`<button class="level-btn ${saved.done.includes(i+1)?'done':''}" data-level="${i+1}">${saved.done.includes(i+1)?'✦ ':''}${String(i+1).padStart(2,'0')}<small>${t}</small></button>`).join('')}</div><button data-action="menu">처음 화면</button>`);}
function pause(){if(state==='playing'){state='paused';keys={};modal('<div class="overline">TAKE A LITTLE BREATH</div><h2>잠깐 쉬어가요</h2><p>준비되면 하늘길을 계속 걸어볼까요?</p><button class="primary" data-action="resume">계속하기</button><button class="secondary" data-action="restart">다시 시작</button>')}else if(state==='paused')resume();}
function resume(){state='playing';keys={};$('#overlay').classList.add('hidden');}
function finish(){if(state!=='playing')return;state='clear';if(!saved.done.includes(level))saved.done.push(level);const best=saved.best[level];if(!best||elapsed<best.time)saved.best[level]={time:Math.round(elapsed),coins};saved.last=Math.min(level+1,20);persist();tone(900,.25);modal(`<div class="overline">${level===20?'THE LIGHT IS HOME':'TRAIL COMPLETE'}</div><h2>${level===20?'별빛이 돌아왔어요!':'멋진 한 걸음!'}</h2><p>${level===20?'마지막 수호자를 넘어 별빛의 심장을 되찾았습니다.':`${world.title}의 길을 완성했습니다.`}<br>별 조각 ${coins}개 · ${Math.floor(elapsed/60)}분 ${Math.floor(elapsed%60)}초 · 재도전 ${deathCount}회</p><button class="primary" data-action="${level===20?'levels':'next'}">${level===20?'다른 모험 둘러보기':'다음 스테이지 →'}</button><button class="secondary" data-action="restart">한 번 더</button>`);}
function hurt(fall=false){if(state!=='playing'||(!fall&&player.inv>0))return;if(player.shield&&!fall){player.shield=0;player.inv=100;burst(player.x,player.y,'#9df2ef');tone(220);return;}player.hp--;shake=10;tone(130,.2,'sawtooth',.025);if(player.hp<=0){deathCount++;player.hp=3;player.shield=0;player.x=checkpoint;player.y=400;player.vx=player.vy=0;player.inv=120;toast(checkpointActive?'별 등불에서 다시 출발!':'다시 도전! 천천히 점프해 보세요.')}else if(fall){player.x=checkpoint;player.y=400;player.vx=player.vy=0;player.inv=100;}else{player.inv=100;player.vy=-6;player.vx=-player.face*5;}updateHUD();}
function step(){
 if(state!=='playing')return;tick++;elapsed+=1/60;if(toastTime>0&&!--toastTime)$('#toast').style.opacity=0;if(player.inv>0)player.inv--;if(shake>0)shake--;
 const dir=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),running=keys.ShiftLeft||keys.ShiftRight||keys.Shift,max=running?6.3:4.5;
 player.vx+=dir*.68;player.vx*=dir?.93:(world.biome===2?.94:.76);player.vx=Math.max(-max,Math.min(max,player.vx));if(dir)player.face=dir;
 if(player.onGround)coyote=7;else coyote--;if(jumpBuffer>0)jumpBuffer--;if(jumpBuffer>0&&coyote>0){player.vy=-12.3;player.onGround=false;coyote=0;jumpBuffer=0;tone(540,.12,'triangle');}
 if(!(keys.Space||keys.ArrowUp||keys.KeyW)&&player.vy<-5)player.vy+=.38;
 const solids=world.platforms.concat(world.blocks);
 for(const p of world.platforms)if(p.moving){let old=p.x;p.x=p.base+Math.sin(tick*.018+p.phase)*38;p.dx=p.x-old;if(player.onGround&&Math.abs(player.y+player.h-p.y)<2&&player.x+player.w>old&&player.x<old+p.w)player.x+=p.dx;}

 const oldY=player.y;player.vy=Math.min(14,player.vy+.52);player.y+=player.vy;player.onGround=false;
 for(const p of solids)if(overlap(player,p)){if(player.vy>=0&&oldY+player.h<=p.y+14){player.y=p.y-player.h;player.vy=0;player.onGround=true;}else if(player.vy<0&&oldY>=p.y+p.h-14){player.y=p.y+p.h;player.vy=1;if('used'in p&&!p.used){p.used=true;burst(p.x+20,p.y,'#ffe08c');if(p.power){world.powers.push({x:p.x+7,y:p.y-34,w:26,h:26});toast('바람 방울 발견! 닿으면 한 번 보호받아요.')}else{coins+=5;tone(900);}}}}
 for(const gem of world.gems)if(!gem.taken&&overlap(player,gem)){gem.taken=true;coins++;burst(gem.x+9,gem.y+10,'#ffdf87',5);tone(1000,.065);}
 for(const p of world.powers)if(!p.taken&&overlap(player,p)){p.taken=true;player.shield=1;tone(750,.2);burst(p.x,p.y,'#a9fcf1');}
 for(const e of world.enemies){if(e.dead)continue;e.x+=e.vx;if(e.x<e.min||e.x+e.w>e.max)e.vx*=-1;if(overlap(player,e)){if(player.vy>0&&oldY+player.h<=e.y+12){e.dead=true;player.vy=-8.8;coins+=2;burst(e.x+17,e.y,'#dfb9d5');tone(280,.1,'triangle')}else hurt();}}

 const b=world.boss;if(b&&b.hp>0){if(b.inv)b.inv--;b.x+=b.vx;if(b.x<b.min||b.x+b.w>b.max)b.vx*=-1;b.y=b.baseY-Math.max(0,Math.sin(tick*.037))*27;if(overlap(player,b)){if(player.vy>0&&oldY+player.h<=b.y+18){player.vy=-12;if(!b.inv){b.hp--;b.inv=70;burst(b.x+32,b.y,'#ffdf87',24);tone(190,.18);if(!b.hp){coins+=25;toast('수호자가 잠들었어요. 별문으로 가세요!');}}}else hurt();}}
 if(!checkpointActive&&player.x>world.checkpoint){checkpointActive=true;checkpoint=world.checkpoint;player.hp=3;toast('별 등불 저장 완료 · 생명력 회복');tone(720,.25);burst(checkpoint,430,'#d9f99b',30);}
 if(player.y>H+100)hurt(true);

 camera=Math.max(0,Math.min(world.width-W,player.x-W*.33));
 for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.16;p.life--}particles=particles.filter(p=>p.life>0);if(tick%10===0)updateHUD();
}
function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function ellipse(x,y,rx,ry,color){ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill()}
function star(x,y,r,color,rot=0){ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<8;i++){let a=i*Math.PI/4+rot,rr=i%2?r*.38:r;const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill()}
function cloud(x,y,s=1){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ellipse(0,0,43,14,'#ffffff58');ellipse(-18,-10,20,18,'#ffffff58');ellipse(16,-14,25,22,'#ffffff58');ctx.restore()}
function draw(){
 const t=themes[world.biome];const gradient=ctx.createLinearGradient(0,0,0,H);gradient.addColorStop(0,t.sky[0]);gradient.addColorStop(1,t.sky[1]);ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
 ellipse(970-camera*.035,100,47,47,world.biome>=3?'#f9e6b8':'#fff0bc');if(world.biome>=3)for(let i=0;i<45;i++)star((i*137+34-camera*.08+W*4)%W,25+i*79%270,1.5+i%2,'#f3e9d18a');
 for(let i=0;i<7;i++)cloud(((i*255-camera*.13)%(W+250)+W+250)%(W+250)-100,80+i%3*43,.7+i%3*.22);
 for(let layer=0;layer<2;layer++){ctx.fillStyle=layer?t.mount:t.far;for(let i=-1;i<7;i++){const x=i*330-camera*(layer?.22:.12)%330,y=layer?455:410;ctx.beginPath();ctx.moveTo(x-50,600);if(world.biome===4){ctx.lineTo(x-50,y-80);ctx.lineTo(x+20,y-80);ctx.lineTo(x+20,y-140);ctx.lineTo(x+90,y-140);ctx.lineTo(x+90,y-40);ctx.lineTo(x+170,y-40);ctx.lineTo(x+170,600)}else{ctx.bezierCurveTo(x+20,y-150-(i%2)*70,x+160,y-130,x+260,600)}ctx.fill();}}
 ctx.save();if(shake)ctx.translate(Math.sin(tick*2)*shake*.5,0);ctx.translate(-Math.floor(camera),0);
 for(const p of world.platforms){if(p.x+p.w<camera-50||p.x>camera+W+50)continue;round(p.x,p.y,p.w,p.h,p.ground?5:8,t.ground);round(p.x,p.y,p.w,10,5,t.top);ctx.fillStyle='#0000000c';if(p.ground){for(let i=0;i<p.w;i+=38){ctx.fillRect(p.x+i+8,p.y+27,19,5);ctx.fillRect(p.x+i+21,p.y+52,8,5)}for(let i=18;i<p.w-10;i+=65){ctx.strokeStyle=t.top;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+i,p.y);ctx.lineTo(p.x+i-4,p.y-8);ctx.moveTo(p.x+i,p.y);ctx.lineTo(p.x+i+5,p.y-5);ctx.stroke();}}else{round(p.x+6,p.y+12,p.w-12,4,2,'#ffffff18');if(p.moving){ctx.fillStyle='#ffffff66';ctx.font='12px sans-serif';ctx.fillText('↔',p.x+p.w/2-6,p.y+17);}}}
 for(const b of world.blocks){round(b.x,b.y,b.w,b.h,6,b.used?'#7e8d75':'#eac46d');round(b.x+4,b.y+4,b.w-8,b.h-8,3,b.used?'#8c9a84':'#f7da8b');if(!b.used)star(b.x+20,b.y+18,10,'#9d7437');else ellipse(b.x+20,b.y+18,3,3,'#66765d');}
 for(const g of world.gems)if(!g.taken&&g.x>camera-30&&g.x<camera+W+30){const bob=Math.sin(tick*.06+g.x)*3;ellipse(g.x+9,g.y+13+bob,14,14,'#fff3a51c');star(g.x+9,g.y+11+bob,11,'#fff1b4');star(g.x+9,g.y+11+bob,6,'#eab85c');}
 for(const p of world.powers)if(!p.taken){ellipse(p.x+13,p.y+13,16,16,'#9df2ef77');star(p.x+13,p.y+13,11,'#ddffef',tick*.03);}
 for(const e of world.enemies)if(!e.dead){const bob=Math.sin(tick*.12+e.x*.1)*2;ellipse(e.x+17,e.y+29,20,5,'#18382b26');round(e.x,e.y+3+bob,34,25,12,'#8b7289');round(e.x+5,e.y+1+bob,24,8,5,'#ad92aa');round(e.x+7,e.y+12+bob,6,7,2,'#f1e9ce');round(e.x+22,e.y+12+bob,6,7,2,'#f1e9ce');ctx.fillStyle='#3e3b50';ctx.fillRect(e.x+9+(e.vx>0?1:-1),e.y+14+bob,3,4);ctx.fillRect(e.x+24+(e.vx>0?1:-1),e.y+14+bob,3,4);}
 for(const h of world.hazards){if(h.type==='spikes'){ctx.fillStyle='#d7bcb5';for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(h.x+i*15,h.y+20);ctx.lineTo(h.x+i*15+7,h.y);ctx.lineTo(h.x+i*15+15,h.y+20);ctx.fill()}}else{ellipse(h.x+14,h.y+14,19,19,'#fa987b40');star(h.x+14,h.y+14,20,'#e98d7c',tick*.04);ellipse(h.x+14,h.y+14,8,8,'#ffdfb1');}}
 const cp=world.checkpoint;round(cp+9,428,6,62,3,'#6c8572');ellipse(cp+12,419,15,19,checkpointActive?'#fff0aa':'#c2d5b3');star(cp+12,419,9,checkpointActive?'#e6b959':'#8baf99');if(checkpointActive)ellipse(cp+12,419,25,28,'#fff5bd25');
 const b=world.boss;if(b&&b.hp>0&&!(b.inv&&tick%6<3)){ellipse(b.x+33,b.y+66,40,7,'#15172222');round(b.x,b.y+10,66,54,16,'#6f647b');round(b.x+7,b.y,52,23,10,t.accent);star(b.x+33,b.y+3,14,t.accent);round(b.x+12,b.y+28,14,12,4,'#fff3c8');round(b.x+41,b.y+28,14,12,4,'#fff3c8');round(b.x+18,b.y+30,5,8,2,'#303747');round(b.x+43,b.y+30,5,8,2,'#303747');for(let i=0;i<b.maxHp;i++)ellipse(b.x+12+i*12,b.y-20,4,4,i<b.hp?'#f3bd97':'#514554');}
 const gx=world.goal;round(gx-7,380,80,110,38,'#d8d5b25c');round(gx,387,66,103,32,'#688f84');round(gx+7,395,52,95,25,'#b7e5c5');ellipse(gx+33,440,21+Math.sin(tick*.05)*2,41,'#f1f5c0');star(gx+33,432,17,'#fffce0',tick*.008);round(gx-20,480,105,10,4,'#eee2b0');
 if(!(player.inv&&tick%8<4)){const p=player,x=p.x,y=p.y,walk=p.onGround?Math.sin(tick*.22)*3:1;ellipse(x+15,y+43,19,5,'#264d3b24');if(p.shield){ctx.strokeStyle='#dbfff1';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x+15,y+23,28,32,0,0,Math.PI*2);ctx.stroke();}round(x+3,y+31,10,12+walk,4,'#35585a');round(x+18,y+31,10,12-walk,4,'#35585a');round(x+1,y+16,29,22,9,'#e6aa73');round(x-4,y+19,7,17,4,'#be7b62');round(x+5,y+4,22,23,9,'#fff0ce');round(x+1,y,29,15,8,'#579a8a');round(x+8,y-6,12,12,5,'#75b4a0');ctx.fillStyle='#35545a';ctx.fillRect(x+(p.face>0?20:8),y+13,3,5);round(x+1,y+25,29,6,2,'#f2d98b');ctx.fillStyle='#f2d98b';ctx.beginPath();ctx.moveTo(x+(p.face>0?0:30),y+25);ctx.lineTo(x+(p.face>0?-15:45),y+20+Math.sin(tick*.1)*3);ctx.lineTo(x+(p.face>0?-10:40),y+30);ctx.fill();}
 for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;ctx.restore();
}
function frame(now){const dt=Math.min((now-lastTime)/1000,.06);lastTime=now;acc+=dt;while(acc>=1/60){step();acc-=1/60}draw();requestAnimationFrame(frame)}
function press(code){if(!keys[code]&&['Space','ArrowUp','KeyW'].includes(code))jumpBuffer=9;keys[code]=true;}
document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyP'||e.code==='Escape'){pause();return}if(e.code==='KeyR'&&['playing','paused'].includes(state)){play(level);return}press(e.code)});
document.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
document.querySelectorAll('[data-key]').forEach(btn=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);press(btn.dataset.key)});for(const name of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(name,()=>keys[btn.dataset.key]=false)});
$('#panel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.level){play(+b.dataset.level);return}switch(b.dataset.action){case 'start':play(saved.last||1);break;case 'levels':levelMenu();break;case 'menu':menu();break;case 'resume':resume();break;case 'restart':play(level);break;case 'next':play(Math.min(20,level+1));break;}});
$('#levels').onclick=()=>{keys={};levelMenu()};$('#pause').onclick=pause;$('#home').onclick=e=>{e.preventDefault();keys={};menu()};$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'소리 OFF':'소리 ON';$('#sound').setAttribute('aria-label',muted?'소리 켜기':'소리 끄기');tone(700)};
load(Math.max(1,Math.min(20,saved.last||1)));menu();requestAnimationFrame(frame);

window.lumiDiagnostics=()=>({state,level,player:{...player},stageCount:titles.length,completed:saved.done.length,levels:titles.map((title,i)=>{const l=makeLevel(i+1);return {stage:i+1,title,width:l.width,platforms:l.platforms.length,boss:!!l.boss,maxGap:Math.max(...l.platforms.filter(p=>p.ground).slice(1).map((p,j)=>p.x-(l.platforms.filter(q=>q.ground)[j].x+l.platforms.filter(q=>q.ground)[j].w)))}})});
