<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b18"><title>STAR SQUAD · 우주 편대</title><style>*{box-sizing:border-box}body{margin:0;background:#070b18;color:#e8edff;font-family:system-ui,-apple-system,sans-serif}main{max-width:1020px;margin:auto;padding:24px 28px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:2px;font-size:18px}.brand small{display:block;color:#647190;font-size:9px;letter-spacing:3px;margin:7px 0 0 24px}button{font:inherit;color:#aab9d9;background:#111a30;border:1px solid #26334e;border-radius:7px;cursor:pointer;padding:8px 12px}header button{margin-left:8px;font-size:12px}.cabinet{max-width:480px;margin:auto;border:1px solid #28324d;background:#0b1122;border-radius:16px;overflow:hidden;box-shadow:0 20px 90px #0008}.hud{display:flex;justify-content:space-between;padding:17px 24px;color:#7d8eaf;font-size:10px;letter-spacing:2px}.hud strong{display:block;color:#fff;font-size:22px;letter-spacing:2px;margin-top:5px;font-family:monospace}.hud .best strong{color:#ffcf70}.screen{position:relative;aspect-ratio:480/680;background:#050916;touch-action:none}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(#05091688,#050916dd)}.eyebrow{font-size:10px;letter-spacing:4px;color:#81ccf8}h1{font-size:70px;line-height:.95;letter-spacing:-3px;margin:22px 0;font-weight:950}h1 em{font-style:normal;color:#9af7db;text-shadow:0 0 30px #69eabc44}#message{font-size:14px;color:#9cabc9;line-height:1.8;margin:0 0 30px}#start{background:#a2f4d5;color:#092820;width:240px;padding:16px 24px;font-weight:800;border:0;display:flex;justify-content:space-between;box-shadow:0 0 40px #88ffc522}#overlay small{font-size:11px;color:#6d7f9e;margin-top:18px}.status{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:10px;letter-spacing:1px;color:#7890b0}#lives{color:#a2f4d5;font-size:17px;letter-spacing:4px}.status button{border:0;background:none;font-size:10px;padding:4px}footer{max-width:480px;margin:22px auto;color:#586b8b;font-size:10px;display:flex;gap:20px;align-items:start}footer span{white-space:nowrap;letter-spacing:1px}footer p{margin:0;line-height:1.7}i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#a2f4d5;margin-right:5px}#banner{position:absolute;top:44%;width:100%;text-align:center;font-weight:900;letter-spacing:4px;color:#a2f4d5;font-size:22px;pointer-events:none}@media(max-width:540px){main{padding:12px 10px;padding-bottom:env(safe-area-inset-bottom)}header{margin-bottom:12px}.brand{font-size:14px}.cabinet{max-width:min(100%,calc((100svh - 165px)*.706))}.hud{padding:10px 16px}.hud strong{font-size:18px}h1{font-size:clamp(42px,14vw,70px)}footer{margin:12px auto}.best{display:block}.status{padding:8px 12px}#overlay p{margin-bottom:20px}#start{max-width:75%}}
</style></head><body><main><header><a class="brand" href="./">✦ STAR SQUAD <small>ARCADE / 01</small></a><div><button id="sound" aria-label="효과음 켜기">소리 OFF</button><button id="pause" aria-label="일시정지">Ⅱ</button></div></header><section class="cabinet"><div class="hud"><div>SCORE<strong id="score">000000</strong></div><div class="best">BEST<strong id="best">000000</strong></div><div>STAGE<strong id="stage">01</strong></div></div><div class="screen"><canvas id="game" width="480" height="680" aria-label="우주 비행기 슈팅 게임"></canvas><div id="overlay"><span class="eyebrow">THE ARCADE IS BACK</span><h1>STAR<br><em>SQUAD</em></h1><p id="message">별들 사이, 마지막 비행대.<br>적 편대를 돌파하고 우주를 지켜라.</p><button id="start">출격하기 <span>→</span></button><small>화면을 좌우로 드래그 · 자동 발사</small></div><div id="banner"></div></div><div class="status"><span id="lives">▲ ▲ ▲</span><span id="mode">READY TO LAUNCH</span><button id="full">⛶ 전체 화면</button></div></section><footer><span><i></i> TOUCH & PLAY</span><p>모바일: 좌우 드래그 / PC: ← → 또는 A D · SPACE 발사 · P 일시정지</p></footer></main><script>const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),$=s=>document.querySelector(s);const W=480,H=680;let state='ready',score=0,best=0,stage=1,lives=3,time=0,enemies=[],shots=[],bad=[],particles=[],player={x:240,y:622},fire=0,spawn=0,inv=0,double=0,captured=null,keys={},muted=true,audio=null,last=0,delay=0;try{best=+(localStorage.getItem('star-squad-best')||0)}catch{}let stars=Array.from({length:85},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.4}));
const sprites={ship:['000010000','000121000','000121000','100121001','111121111','011333110','010101010'],bug:['010000010','001111100','011221110','112222211','111111111','010101010','100000001'],boss:['001000100','011111110','112222211','123333321','112222211','011111110','010000010']};
function sprite(name,x,y,color,scale=3,rot=0){ctx.save();ctx.translate(x,y);ctx.rotate(rot);const a=sprites[name];a.forEach((row,j)=>[...row].forEach((v,i)=>{if(v!=='0'){ctx.fillStyle=v==='2'?'#fff0b2':v==='3'?'#eb727d':color;ctx.fillRect((i-4.5)*scale,(j-3.5)*scale,scale,scale)}}));ctx.restore()}
function tone(f,d=.08){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f/2,audio.currentTime+d);g.gain.setValueAtTime(.035,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function hud(){$('#score').textContent=String(score).padStart(6,'0');$('#best').textContent=String(best).padStart(6,'0');$('#stage').textContent=String(stage).padStart(2,'0');$('#lives').textContent='▲ '.repeat(Math.max(0,lives));$('#mode').textContent=double>0?'DUAL FIGHTER':state==='playing'?'MISSION IN PROGRESS':'READY TO LAUNCH'}
function wave(){enemies=[];bad=[];shots=[];captured=null;delay=1.6;$('#banner').textContent=stage%3===0?'CHALLENGE STAGE':'STAGE '+String(stage).padStart(2,'0');for(let r=0;r<5;r++)for(let c=0;c<8;c++)enemies.push({x:-100-c*30,y:-100-r*40,homeX:65+c*50,homeY:80+r*43,r,c,t:-.07*(r*8+c),mode:'enter',hp:r===0?2:1,alive:true,challenge:stage%3===0});spawn=1.8}
function start(){score=0;stage=1;lives=3;double=0;inv=2;time=0;player.x=240;particles=[];state='playing';$('#overlay').style.display='none';wave();tone(600);hud()}
function explode(x,y,col){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*220,vy:(Math.random()-.5)*220,t:.5+Math.random()*.4,col});tone(150,.12)}
function hit(){if(inv>0)return;explode(player.x,player.y,'#9af7db');lives--;double=0;inv=2.5;bad=[];if(lives<=0){state='over';$('#overlay').style.display='flex';$('h1').innerHTML='MISSION<br><em>OVER</em>';$('#message').innerHTML='최종 점수 '+score.toLocaleString()+'<br>STAGE '+stage+' · 다시 도전해 보세요';$('#start').innerHTML='다시 출격 <span>→</span>';$('#banner').textContent=''}hud()}
function addScore(n){score+=n;if(score>best){best=score;try{localStorage.setItem('star-squad-best',best)}catch{}}hud()}
function update(dt){time+=dt;stars.forEach(s=>{s.y=(s.y+dt*s.s*24)%H});if(state!=='playing')return;inv-=dt;double=Math.max(0,double-dt);delay-=dt;if(delay<=0)$('#banner').textContent='';let dir=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0);player.x=Math.max(20,Math.min(W-20,player.x+dir*310*dt));fire-=dt;if(fire<=0){fire=.19;for(let off of double>0?[-13,13]:[0])shots.push({x:player.x+off,y:player.y-17});tone(950,.035)}spawn-=dt;if(spawn<=0&&delay<=0){spawn=Math.max(.35,1.5-stage*.08);const pool=enemies.filter(e=>e.alive&&e.mode==='formation');if(pool.length){let e=pool[Math.floor(Math.random()*pool.length)];e.mode=e.r===0&&stage%3!==0&&Math.random()<.3?'tractor':'dive';e.t=0;e.sx=e.x;e.sy=e.y;e.target=player.x}}
for(let e of enemies){if(!e.alive)continue;e.t+=dt;if(e.mode==='enter'){if(e.t<0)continue;let p=Math.min(1,e.t/1.5);e.x=e.homeX+Math.sin(p*Math.PI*2)*160*(1-p);e.y=e.homeY-(1-p)*260;if(p===1){e.mode='formation';e.t=0}}else if(e.mode==='formation'){e.x=e.homeX+Math.sin(time*1.2)*18;e.y=e.homeY+Math.sin(time*2+e.c*.4)*4}else if(e.mode==='tractor'){e.x=e.sx;e.y=270;if(e.t>1&&e.t<3&&Math.abs(player.x-e.x)<38&&inv<=0){captured={x:e.x,y:320,owner:e};lives--;inv=3;player.x=240;e.mode='return';e.t=0;if(lives<=0){lives=1;captured=null;hit()}hud()}if(e.t>3){e.mode='return';e.t=0}}else if(e.mode==='dive'){e.x=e.sx+Math.sin(e.t*3)*90+(e.target-e.sx)*Math.min(1,e.t/2);e.y=e.sy+e.t*(150+stage*9);if(e.y>H+35){if(e.challenge){e.alive=false;continue}e.mode='return';e.t=0;e.y=-35}if(!e.challenge&&Math.random()<dt*(.35+stage*.08)){let dx=player.x-e.x,dy=player.y-e.y,m=Math.hypot(dx,dy);bad.push({x:e.x,y:e.y,vx:dx/m*155,vy:dy/m*155})}}else if(e.mode==='return'){e.x+=(e.homeX-e.x)*Math.min(1,dt*3);e.y+=(e.homeY-e.y)*Math.min(1,dt*3);if(Math.abs(e.y-e.homeY)<3){e.mode='formation';e.t=0}}if(Math.hypot(e.x-player.x,e.y-player.y)<23){hit();e.alive=false}for(let s of shots){if(!s.dead&&Math.abs(s.x-e.x)<17&&Math.abs(s.y-e.y)<16){s.dead=true;e.hp--;if(e.hp<=0){e.alive=false;explode(e.x,e.y,e.r===0?'#ffcc70':'#a3a0ff');addScore(e.mode==='dive'?300:e.r===0?150:80);if(captured?.owner===e){double=30;captured=null;addScore(500);$('#banner').textContent='DUAL FIGHTER';delay=1.5;hud()}}}}}
shots.forEach(s=>s.y-=dt*490);shots=shots.filter(s=>!s.dead&&s.y>-20);bad.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-player.x,b.y-player.y)<13){b.y=999;hit()}});bad=bad.filter(b=>b.y<H+10&&b.y>-30&&b.x>-20&&b.x<W+20);if(enemies.every(e=>!e.alive)&&state==='playing'){stage++;addScore(1000);wave()}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt});particles=particles.filter(p=>p.t>0)}
function draw(){ctx.fillStyle='#050916';ctx.fillRect(0,0,W,H);for(let s of stars){ctx.fillStyle=s.s>1.6?'#536787':'#253650';ctx.fillRect(s.x,s.y,s.s,s.s)}for(let e of enemies){if(!e.alive||e.t<0)continue;let color=e.r===0?'#ffcc70':e.r<3?'#aa92f5':'#e77c9a';if(e.mode==='tractor'&&e.t> .6){ctx.fillStyle='#85e8cb22';ctx.beginPath();ctx.moveTo(e.x-10,e.y);ctx.lineTo(e.x-55,650);ctx.lineTo(e.x+55,650);ctx.lineTo(e.x+10,e.y);ctx.fill();ctx.strokeStyle='#85e8cb77';for(let y=e.y+25;y<650;y+=22){ctx.beginPath();ctx.moveTo(e.x-(y-e.y)*.12,y);ctx.lineTo(e.x+(y-e.y)*.12,y);ctx.stroke()}}sprite(e.r===0?'boss':'bug',e.x,e.y,color,3,e.mode==='dive'?Math.sin(e.t*3)*.5:0)}if(captured)sprite('ship',captured.x,captured.y,'#9af7db');ctx.fillStyle='#a2f4d5';for(let s of shots){ctx.fillRect(s.x-2,s.y-8,4,14)}ctx.fillStyle='#ff8c77';bad.forEach(b=>ctx.fillRect(b.x-2,b.y-4,4,9));particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3)});ctx.globalAlpha=1;if(state!=='over'&&(inv<=0||Math.floor(inv*12)%2===0)){sprite('ship',player.x,player.y,'#9af7db',3);if(double>0)sprite('ship',player.x+25,player.y,'#9af7db',3);ctx.fillStyle='#ffd392';ctx.fillRect(player.x-3,player.y+13,6,5+Math.random()*8)}}
function frame(t){const dt=Math.min(.033,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(frame)}
let pointer=null,px=0;canvas.addEventListener('pointerdown',e=>{pointer=e.pointerId;px=e.clientX;canvas.setPointerCapture(pointer)});canvas.addEventListener('pointermove',e=>{if(e.pointerId===pointer&&state==='playing'){player.x=Math.max(20,Math.min(W-20,player.x+(e.clientX-px)*W/canvas.getBoundingClientRect().width));px=e.clientX}});for(let n of ['pointerup','pointercancel'])canvas.addEventListener(n,()=>pointer=null);window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='p')pause()});window.addEventListener('keyup',e=>keys[e.key]=false);function pause(){if(state==='playing'){state='paused';$('#banner').textContent='PAUSED';$('#pause').textContent='▶'}else if(state==='paused'){state='playing';$('#banner').textContent='';$('#pause').textContent='Ⅱ'}}document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});window.addEventListener('blur',()=>{keys={};if(state==='playing')pause()});$('#start').onclick=start;$('#pause').onclick=pause;$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent='소리 '+(muted?'OFF':'ON');$('#sound').setAttribute('aria-label',muted?'효과음 켜기':'효과음 끄기');tone(500)};$('#full').onclick=()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else{$('#full').textContent='Safari: 홈 화면에 추가'}};hud();requestAnimationFrame(frame);
</script></body></html>
